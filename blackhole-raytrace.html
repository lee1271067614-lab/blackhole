<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>卡冈图雅 · 光线追踪</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #c{display:block;position:fixed;inset:0;cursor:grab;touch-action:none;width:100%;height:100%;}
  #c.drag{cursor:grabbing;}
  #title{position:fixed;left:46px;top:40px;pointer-events:none;user-select:none;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    color:#f3ede2;text-shadow:0 2px 22px rgba(255,150,60,.35);}
  #title b{display:block;font-size:30px;font-weight:600;letter-spacing:.34em;color:#fff4e6;}
  #title span{display:block;margin-top:9px;font-size:12.5px;letter-spacing:.30em;color:rgba(255,214,170,.62);}
  #hint{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);
    padding:11px 22px;border-radius:999px;white-space:nowrap;
    background:rgba(18,12,8,.55);border:1px solid rgba(255,180,110,.16);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    font-size:13px;letter-spacing:.10em;color:rgba(255,224,196,.82);pointer-events:none;user-select:none;}
  #fps{position:fixed;right:18px;top:16px;display:none;white-space:pre;
    font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.5;
    color:#9fe0c8;text-shadow:0 1px 4px #000;pointer-events:none;}
  #err{position:fixed;left:0;right:0;top:0;padding:20px;color:#f88;white-space:pre-wrap;
    font-family:ui-monospace,monospace;font-size:12px;display:none;background:rgba(0,0,0,.8);z-index:9;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><b>卡冈图雅</b><span>史瓦西度规 · 光子测地线</span></div>
<div id="hint">拖动 旋转　·　滚轮/双指 缩放　·　点击 引力脉冲　·　空格 暂停　·　R 反向　·　+/− 曝光</div>
<div id="fps"></div>
<div id="err"></div>
<script>
(function () {
"use strict";
const canvas = document.getElementById('c');
const errEl = document.getElementById('err');
function fail(msg){ errEl.style.display='block'; errEl.textContent = 'WebGL 失败:\n'+msg; throw new Error(msg); }

const Q = new URLSearchParams(location.search);
const STILL = Q.has('still');
const SHOW_FPS = Q.has('fps');
if(Q.has('clean')){
  const _t=document.getElementById('title'), _h=document.getElementById('hint');
  if(_t) _t.style.display='none'; if(_h) _h.style.display='none';
}
const QUAL = Q.has('q') ? parseFloat(Q.get('q')) : (STILL ? 1.0 : 0.62);
let yaw = Q.has('yaw') ? parseFloat(Q.get('yaw')) : 0.62;
let pitch = Q.has('pitch') ? parseFloat(Q.get('pitch')) : 0.24;
let dist = Q.has('dist') ? parseFloat(Q.get('dist')) : 38.0;
let exposure = Q.has('exp') ? parseFloat(Q.get('exp')) : 0.50;
const FIXED_T = Q.has('t') ? parseFloat(Q.get('t')) : null;
const t0 = performance.now();
const fpsEl = document.getElementById('fps');
if (SHOW_FPS) fpsEl.style.display='block';

// ---------- WebGL2 ----------
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, powerPreference:'high-performance', preserveDrawingBuffer: STILL});
if (!gl) fail('本浏览器不支持 WebGL2');

const VERT = `#version 300 es
const vec2 P[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
out vec2 vUV;
void main(){ vec2 p=P[gl_VertexID]; vUV=p*0.5+0.5; gl_Position=vec4(p,0.0,1.0); }`;

const FRAG = `#version 300 es
precision highp float;
in vec2 vUV;
out vec4 outColor;

uniform vec2  uRes;
uniform float uTime;
uniform vec3  uCamPos;
uniform vec3  uCamRight;
uniform vec3  uCamUp;
uniform vec3  uCamFwd;
uniform float uTanHalf;
uniform float uExposure;
// 颜色完全由物理观测温度决定, 无主题/配色
uniform sampler2D uStars;
uniform float uPulse;   // 引力脉冲 0..1 (点击触发)
uniform float uSpin;    // 盘旋转方向 ±1

const float RS = 1.0;      // 史瓦西半径 (几何单位)
const float RIN = 3.0;     // 内缘 ISCO
const float ROUT = 11.0;   // 外缘
const float T0 = 8000.0;   // 内缘发射温度 (K) — 只定色, 亮度由 g 因子决定

// ---- 噪声 ----
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=a*vnoise(p); p*=2.02; a*=0.5;} return s; }
vec2 hash2(vec2 p){ p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))); return fract(sin(p)*43758.5453); }
float voronoi(vec2 p){ vec2 ip=floor(p), fp=fract(p); float d=8.0;
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
    vec2 g=vec2(float(x),float(y)); vec2 o=hash2(ip+g); vec2 r=g+o-fp; d=min(d,dot(r,r)); }
  return sqrt(d); }

// ---- 黑体连续谱 (Tanner-Helland 近似): 输入开尔文, 输出线性 RGB ----
vec3 blackbody(float T){
  T = clamp(T, 1000.0, 40000.0);
  float t = T/100.0;
  float r,g,b;
  if(t <= 66.0){ r = 255.0; }
  else { r = 329.698727446 * pow(t-60.0, -0.1332047592); }
  if(t <= 66.0){ g = 99.4708025861 * log(t) - 161.1195681661; }
  else { g = 288.1221695283 * pow(t-60.0, -0.0755148492); }
  if(t >= 66.0){ b = 255.0; }
  else if(t <= 19.0){ b = 0.0; }
  else { b = 138.5177312231 * log(t-10.0) - 305.0447927307; }
  vec3 srgb = clamp(vec3(r,g,b)/255.0, 0.0, 1.0);
  return pow(srgb, vec3(2.2));           // sRGB -> 线性
}

// ---- 星空背景 (方向 -> 贴图) ----
vec3 starColor(vec3 dir){
  float u = atan(dir.z, dir.x)/6.2831853 + 0.5;
  float v = acos(clamp(dir.y,-1.0,1.0))/3.14159265;
  return texture(uStars, vec2(u,v)).rgb;
}

vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
  vec3 rd = normalize(uCamFwd + uv.x*uCamRight*uTanHalf + uv.y*uCamUp*uTanHalf);

  vec3 pos = uCamPos;
  vec3 vel = rd;

  vec3 col = vec3(0.0);
  float trans = 1.0;
  bool hitHorizon = false;

  const int MAXS = 860;
  for(int i=0;i<MAXS;i++){
    float r = length(pos);
    if(r < RS*1.001){ hitHorizon = true; break; }

    // 自适应步长：靠近光子球/视界更细
    float step = clamp(r*0.038, 0.007, 1.2);

    vec3 h = cross(pos, vel);
    float h2 = dot(h,h);
    // 光子测地线等效加速度 (M=0.5 单位, r_s=1)
    vec3 acc = -1.5 * h2 * pos / pow(r,5.0);

    vec3 prev = pos;
    // 半隐式欧拉
    vel += acc*step;
    pos += vel*step;

    // ---- 体积吸积盘 (有厚度, 高斯垂直分布) ----
    {
      float rc = length(pos.xz);
      float h  = 0.022*rc + 0.028;             // 半厚, 略外扩
      if(rc > RIN && rc < ROUT && abs(pos.y) < h*2.6){
        float yn = pos.y/h;
        float vprof = exp(-0.5*yn*yn);          // 垂直高斯分布

        // 开普勒差速旋转 (旋臂随半径差速卷绕)
        float omega = 1.10/pow(rc, 1.5);
        float ang = omega*uTime*2.4*uSpin;
        float ca=cos(ang), sa=sin(ang);
        vec2 rp = vec2(pos.x*ca - pos.z*sa, pos.x*sa + pos.z*ca);
        vec2 warp = vec2(fbm(rp*0.55+vec2(11.3,4.7)), fbm(rp*0.55+vec2(31.7,19.2)));

        // —— 丝滑流光: 大尺度明暗团 + 同心细流纹 + 稀疏细闪 (无羽毛/暗网) ——
        float big  = fbm(rp*0.75 + warp*0.8);                   // 大尺度明暗团
        float clump= smoothstep(0.28,0.80,big);
        float bandPh = rc*6.2 + fbm(rp*0.45+vec2(2.3,9.1))*7.0; // 同心流纹(随湍流轻扭)
        float band   = pow(0.5 + 0.5*sin(bandPh), 2.0);
        float fine = vnoise(rp*6.5 + vec2(uTime*0.8, uTime*0.6));
        float spark= smoothstep(0.86,0.98,fine)*0.55;           // 稀疏极细闪 (克制)
        // 细颗粒: 高频低幅 fbm, 提供等离子微粒感 (不回到羽毛)
        float fg1 = vnoise(rp*22.0 + vec2(uTime*1.6, -uTime*1.1));
        float fg2 = vnoise(rp*44.0 + vec2(-uTime*2.2, uTime*1.7));
        float fg  = 0.6*fg1 + 0.4*fg2;

        // 发射温度归一 0..1: 内缘最热, 向外递减
        float tempN = pow(RIN/rc, 0.75);
        float edge = smoothstep(ROUT, ROUT-3.5, rc) * smoothstep(RIN-0.15, RIN+0.55, rc);
        float dens = vprof * pow(RIN/rc, 1.30)
                   * (0.55 + 0.45*clump)        // 平滑明暗, 无暗网络
                   * (0.78 + 0.40*band)         // 同心丝缕
                   * (0.66 + 0.60*fg)           // 细颗粒微粒感
                   * edge;
        float speck = smoothstep(0.70, 0.90, fg2);             // 细密闪点
        float grainGlow = (spark + speck*0.6) * vprof * pow(RIN/rc, 1.55) * 0.6;

        // —— 相对论频移: 多普勒 x 引力红移 ——
        vec3 nrm = vec3(0.0,1.0,0.0);
        vec3 tang = normalize(cross(nrm, vec3(pos.x,0.0,pos.z))) * uSpin;
        float beta = sqrt(0.5/rc)/sqrt(max(0.08, 1.0 - 1.0/rc));
        vec3 betaVec = tang*beta;
        vec3 viewDir = -normalize(vel);
        float gamma = 1.0/sqrt(1.0-beta*beta);
        float dopp = 1.0/(gamma*(1.0 - dot(betaVec, viewDir)));
        float grav = sqrt(max(0.0, 1.0 - RS/rc));
        float shift = clamp(dopp*grav, 0.15, 4.0);

        // 观测温度 T_obs = g · T_emit -> 近侧蓝白 / 背离暗红 (真实色移)
        float Tobs = shift * (T0 * tempN);
        vec3 em = blackbody(Tobs);

        // 相对论 beaming: 观测亮度 ~ g^2.6 (严格 g^4, 压一档避免近侧过曝成纯白)
        float beam = pow(shift, 2.6);
        float intensity = 0.72 * (0.45 + 0.85*tempN) * beam;
        float dtau = dens*step*7.0;               // 较不透明 -> 呈现团块表面
        vec3 emitted = em*(intensity*dtau + grainGlow*step*3.0*beam);

        // 引力脉冲: 向外扫过的亮环
        if(uPulse > 0.001){
          float ringR = RIN + (1.0 - uPulse)*(ROUT - RIN);
          float ring = exp(-pow((rc - ringR)/0.55, 2.0)) * uPulse * vprof;
          emitted += blackbody(15000.0) * ring * 3.5;
        }

        col += emitted * trans;
        trans *= exp(-dtau);
        if(trans < 0.006) break;
      }
    }

    if(r > 70.0 && dot(pos,vel) > 0.0){
      col += starColor(normalize(vel)) * trans;
      break;
    }
  }

  // 未逃逸且未命中视界的远光线补采样 (防止边缘空白)
  if(!hitHorizon && trans > 0.008 && length(pos) > ROUT){
    // 已有 star 采样则跳过
  }

  // 未命中任何东西 -> 黑 (视界/阴影)
  // 曝光 + 色调映射
  col *= uExposure;
  // 颜色完全由物理观测温度决定 (无人工配色)
  col = aces(col);
  col = pow(col, vec3(1.0/2.2));
  outColor = vec4(col,1.0);
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) fail(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const U = {};
['uRes','uTime','uCamPos','uCamRight','uCamUp','uCamFwd','uTanHalf','uExposure','uStars','uPulse','uSpin']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

// ---------- 星空贴图 ----------
function makeStars(){
  const W = 4096, H = 2048;
  const cv = document.createElement('canvas'); cv.width=W; cv.height=H;
  const g = cv.getContext('2d');
  // 深空底色 + 银河带
  g.fillStyle = '#000000'; g.fillRect(0,0,W,H);
  // 银河雾带 (关闭: 避免透镜后同心摩尔纹, 保持纯净深空)
  for(let k=0;k<0;k++){
    const x=Math.random()*W, y=H*0.5 + (Math.random()-0.5)*H*0.30;
    const rad=120+Math.random()*320;
    const rg=g.createRadialGradient(x,y,0,x,y,rad);
    const a=0.0008+Math.random()*0.0018;
    rg.addColorStop(0,`rgba(120,140,190,${a})`); rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg; g.beginPath(); g.arc(x,y,rad,0,7); g.fill();
  }
  // 星点 (稀疏、暗、清晰; 高分辨率 -> 透镜后仍是点而非块)
  const NST = 2600;
  for(let i=0;i<NST;i++){
    const x=Math.random()*W, y=Math.random()*H;
    const m=Math.random();
    let r, col;
    if(m>0.988){ r=2.2+Math.random()*1.8; col='rgba(210,222,255,0.92)'; }
    else if(m>0.94){ r=1.3+Math.random()*0.9; col='rgba(190,205,250,0.55)'; }
    else { r=0.7+Math.random()*0.6; col='rgba(170,185,230,0.30)'; }
    g.fillStyle=col; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,cv);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return tex;
}
const starTex = makeStars();

// ---------- Bloom 管线 ----------
const BRIGHT_FRAG = `#version 300 es
precision highp float; in vec2 vUV; out vec4 o;
uniform sampler2D uTex; uniform float uThresh;
void main(){ vec3 c=texture(uTex,vUV).rgb; float l=max(c.r,max(c.g,c.b));
  float k=max(l-uThresh,0.0)/max(l,1e-4); o=vec4(c*k,1.0); }`;
const BLUR_FRAG = `#version 300 es
precision highp float; in vec2 vUV; out vec4 o;
uniform sampler2D uTex; uniform vec2 uDir;
void main(){
  float w0=0.227027,w1=0.1945946,w2=0.1216216,w3=0.0540540,w4=0.0162162;
  vec3 s=texture(uTex,vUV).rgb*w0;
  vec2 d=uDir;
  s+=texture(uTex,vUV+d*1.0).rgb*w1; s+=texture(uTex,vUV-d*1.0).rgb*w1;
  s+=texture(uTex,vUV+d*2.0).rgb*w2; s+=texture(uTex,vUV-d*2.0).rgb*w2;
  s+=texture(uTex,vUV+d*3.0).rgb*w3; s+=texture(uTex,vUV-d*3.0).rgb*w3;
  s+=texture(uTex,vUV+d*4.0).rgb*w4; s+=texture(uTex,vUV-d*4.0).rgb*w4;
  o=vec4(s,1.0); }`;
const PRESENT_FRAG = `#version 300 es
precision highp float; in vec2 vUV; out vec4 o;
uniform sampler2D uScene; uniform sampler2D uBloom; uniform float uInt;
uniform vec2 uRes; uniform float uTime;
float h21(vec2 p){ return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5453); }
void main(){
  vec3 c = texture(uScene,vUV).rgb + texture(uBloom,vUV).rgb*uInt;
  vec2 q = vUV - 0.5;
  float vig = smoothstep(0.95,0.22,length(q));
  c *= mix(0.52,1.0,vig);
  float grain = (h21(vUV*uRes + fract(uTime)*97.0)-0.5)*0.016;
  c += grain;
  o = vec4(c,1.0);
}`;

function mkProg(fs){
  const p=gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) fail(gl.getProgramInfoLog(p));
  return p;
}
const brightP = mkProg(BRIGHT_FRAG), blurP = mkProg(BLUR_FRAG), presentP = mkProg(PRESENT_FRAG);
const UB = {
  bTex: gl.getUniformLocation(brightP,'uTex'), bThresh: gl.getUniformLocation(brightP,'uThresh'),
  blTex: gl.getUniformLocation(blurP,'uTex'), blDir: gl.getUniformLocation(blurP,'uDir'),
  pScene: gl.getUniformLocation(presentP,'uScene'), pBloom: gl.getUniformLocation(presentP,'uBloom'),
  pInt: gl.getUniformLocation(presentP,'uInt'), pRes: gl.getUniformLocation(presentP,'uRes'),
  pTime: gl.getUniformLocation(presentP,'uTime')
};
function makeFBO(w,h){
  const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {fb,tex,w,h};
}
let fboScene=null, fboA=null, fboB=null;

// ---------- 尺寸 ----------
let renderScale = QUAL;
function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const w = Math.round((canvas.clientWidth||window.innerWidth)*dpr*renderScale);
  const h = Math.round((canvas.clientHeight||window.innerHeight)*dpr*renderScale);
  if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
  if(!fboScene || fboScene.w!==w || fboScene.h!==h){
    fboScene = makeFBO(w,h);
    const hw=Math.max(1,Math.round(w/2)), hh=Math.max(1,Math.round(h/2));
    fboA = makeFBO(hw,hh); fboB = makeFBO(hw,hh);
  }
}
if (Q.has('w') && Q.has('h')){ canvas.style.width=Q.get('w')+'px'; canvas.style.height=Q.get('h')+'px'; }
window.addEventListener('resize', ()=>{ if(!STILL) resize(); });

// ---------- 相机 ----------
function camBasis(){
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  const camPos=[dist*Math.cos(yaw)*cp, dist*sp, dist*Math.sin(yaw)*cp];
  const fwd = norm([-camPos[0],-camPos[1],-camPos[2]]);
  let right = norm(cross(fwd,[0,1,0]));
  let up = cross(right,fwd);
  return {camPos,right,up,fwd};
}
function norm(v){ const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }

// ---------- 交互状态 (阻尼 + 惯性 + 脉冲) ----------
let dragging=false;
let yawT = yaw, pitchT = pitch, distT = dist;
let vYaw = 0, vPitch = 0;         // 释放后的惯性速度
let spinDir = 1;                  // 盘旋转方向
let pulse = 0.0;                  // 引力脉冲 0..1
let paused = false;
let autoDrift = !STILL;
let simTime = 0;                  // 盘演化时间(可暂停)

const pointers = new Map();
let pinchPrev = 0, downX=0, downY=0, downT=0, moved=0;

canvas.addEventListener('pointerdown', e=>{
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if(pointers.size===1){ dragging=true; downX=e.clientX; downY=e.clientY; downT=performance.now(); moved=0; autoDrift=false; }
  if(pointers.size===2){ const p=[...pointers.values()]; pinchPrev=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); }
  canvas.classList.add('drag');
});
window.addEventListener('pointermove', e=>{
  if(!pointers.has(e.pointerId)) return;
  const prev=pointers.get(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1 && dragging){
    const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    moved += Math.abs(dx)+Math.abs(dy);
    yawT   -= dx*0.005;
    pitchT += dy*0.004;
    pitchT = Math.max(-1.45, Math.min(1.45, pitchT));
    vYaw = -dx*0.005; vPitch = dy*0.004;
  } else if(pointers.size===2){
    const p=[...pointers.values()];
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinchPrev>0){ distT *= pinchPrev/Math.max(1,d); distT=Math.max(6,Math.min(60,distT)); }
    pinchPrev=d;
  }
});
function endPointer(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinchPrev=0;
  if(pointers.size===0){
    dragging=false; canvas.classList.remove('drag');
    const dtms=performance.now()-downT;
    if(moved<8 && dtms<350){ pulse=1.0; distT*=0.97; }   // 轻点 = 引力脉冲
  }
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', e=>{ e.preventDefault(); distT*=Math.exp(e.deltaY*0.0011); distT=Math.max(6,Math.min(60,distT)); }, {passive:false});
window.addEventListener('keydown', e=>{
  if(e.key==='r'||e.key==='R'){ spinDir*=-1; }
  else if(e.key===' '){ paused=!paused; e.preventDefault(); }
  else if(e.key==='p'||e.key==='P'){ pulse=1.0; }
  else if(e.key==='+'||e.key==='='){ exposure=Math.min(2.6,exposure*1.08); }
  else if(e.key==='-'||e.key==='_'){ exposure=Math.max(0.15,exposure/1.08); }
});

// ---------- 渲染 ----------
function draw(tsec){
  resize();
  const b = camBasis();
  // 1) 场景 -> fboScene
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboScene.fb);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.useProgram(prog);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, tsec);
  gl.uniform3fv(U.uCamPos, b.camPos);
  gl.uniform3fv(U.uCamRight, b.right);
  gl.uniform3fv(U.uCamUp, b.up);
  gl.uniform3fv(U.uCamFwd, b.fwd);
  const fov = 44.0*Math.PI/180.0;
  gl.uniform1f(U.uTanHalf, Math.tan(fov*0.5));
  gl.uniform1f(U.uExposure, exposure);
  gl.uniform1f(U.uPulse, pulse);
  gl.uniform1f(U.uSpin, spinDir);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, starTex);
  gl.uniform1i(U.uStars, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const hw=fboA.w, hh=fboA.h;
  // 2) 亮部提取 + 降采样 -> fboA
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboA.fb); gl.viewport(0,0,hw,hh);
  gl.useProgram(brightP);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboScene.tex); gl.uniform1i(UB.bTex,0);
  gl.uniform1f(UB.bThresh, 0.62);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // 3) 横向模糊 fboA -> fboB
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboB.fb); gl.viewport(0,0,hw,hh);
  gl.useProgram(blurP);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboA.tex); gl.uniform1i(UB.blTex,0);
  gl.uniform2f(UB.blDir, 2.4/hw, 0.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // 4) 纵向模糊 fboB -> fboA
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboA.fb); gl.viewport(0,0,hw,hh);
  gl.useProgram(blurP);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboB.tex); gl.uniform1i(UB.blTex,0);
  gl.uniform2f(UB.blDir, 0.0, 2.4/hh);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // 5) 合成 -> 屏幕
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0,0,canvas.width,canvas.height);
  gl.useProgram(presentP);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboScene.tex); gl.uniform1i(UB.pScene,0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fboA.tex); gl.uniform1i(UB.pBloom,1);
  gl.uniform1f(UB.pInt, 0.42);
  gl.uniform2f(UB.pRes, canvas.width, canvas.height);
  gl.uniform1f(UB.pTime, tsec);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

if(STILL){
  // 固定时间截图 (直接落到目标视角, 不走缓动)
  yaw = yawT; pitch = pitchT; dist = distT;
  if(Q.has('pulse')) pulse = parseFloat(Q.get('pulse'));
  if(Q.has('spin')) spinDir = parseFloat(Q.get('spin'));
  const ts = FIXED_T!==null ? FIXED_T : 3.3;
  draw(ts);
  gl.finish();
  document.body.setAttribute('data-ready','1');
} else {
  let frames=0, fpsT=performance.now(), lastMs=performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now-lastMs)/1000.0); lastMs=now;
    if(!paused) simTime += dt;
    if(autoDrift && !dragging) yawT += dt*0.05;              // 空闲缓慢自转
    if(!dragging && (Math.abs(vYaw)>1e-5 || Math.abs(vPitch)>1e-5)){
      yawT += vYaw; pitchT = Math.max(-1.45,Math.min(1.45,pitchT+vPitch));
      vYaw *= 0.90; vPitch *= 0.90;                          // 惯性衰减
    }
    const k = dragging ? 0.35 : 0.09;                       // 阻尼缓动
    yaw   += (yawT - yaw)*k;
    pitch += (pitchT - pitch)*k;
    dist  += (distT - dist)*k;
    if(pulse>0) pulse = Math.max(0, pulse - dt/1.6);
    draw(simTime);
    frames++;
    if(now-fpsT>500){ if(SHOW_FPS) fpsEl.textContent='FPS '+(frames*1000/(now-fpsT)).toFixed(1)+'\n'+canvas.width+'×'+canvas.height; frames=0; fpsT=now; }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
})();
</script>
